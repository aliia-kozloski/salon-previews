<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hair Salon Website Previews</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',-apple-system,sans-serif;background:#f5f2ee;color:#1a1714;min-height:100vh;display:flex;align-items:center;justify-content:center}
.wrap{max-width:520px;width:100%;padding:48px 24px;text-align:center}
.tag{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:#9a8a76;margin-bottom:12px}
h1{font-family:Georgia,serif;font-size:28px;font-weight:400;margin-bottom:8px;color:#2c2218}
.sub{font-size:14px;color:#8a7a6a;margin-bottom:40px}
.links{display:flex;flex-direction:column;gap:12px}
a{display:block;padding:18px 24px;background:#fff;border-radius:14px;text-decoration:none;color:#4a3520;font-size:16px;font-weight:500;transition:all .25s;box-shadow:0 2px 8px rgba(0,0,0,.04);border:1px solid rgba(0,0,0,.04)}
a:hover{background:#2c2218;color:#f5f2ee;transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.1)}
a span{font-size:12px;color:#9a8a76;display:block;margin-top:4px;font-weight:400}
a:hover span{color:rgba(245,242,238,.5)}
</style>
</head>
<body>
<div class="wrap">
<div class="tag">Client Previews</div>
<h1>Hair Salon Websites</h1>
<p class="sub">Preview pages for prospective clients</p>
<div class="links">
<a href="nica-sam/">Nica &amp; Sam Hair Salon<span>Midtown West &middot; 875 8th Ave</span></a>
<a href="america-hairstyle/">America Hairstyle International<span>New York City</span></a>
</div>
</div>
</body>
</html>
